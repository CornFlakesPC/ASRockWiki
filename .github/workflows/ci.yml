name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  assets:
    name: Lint CSS and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  jekyll-build:
    name: Jekyll build (v${{ matrix.jekyll-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - jekyll-version: "3.9"
            ruby-version: "3.1"
          - jekyll-version: "4.3"
            ruby-version: "3.3"
    env:
      BUNDLE_GEMFILE: fixtures/Gemfile-jekyll-${{ matrix.jekyll-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Initialize search index
        run: bundle exec rake search:init
      - name: Build site
        run: bundle exec jekyll build
